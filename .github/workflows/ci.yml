name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sonora
          POSTGRES_PASSWORD: sonora_ci   # solo para el contenedor efímero del CI
          POSTGRES_DB: sonoraplay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonora -d sonoraplay"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # EG-29: las pruebas de reinicio del consumidor y del broker corren contra RabbitMQ real.
      rabbitmq:
        image: rabbitmq:4.1.8-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: sonora
          RABBITMQ_DEFAULT_PASS: sonora_ci   # solo para el contenedor efímero del CI
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sonora:sonora_ci@localhost:5432/sonoraplay_test
      RABBITMQ_URL: amqp://sonora:sonora_ci@localhost:5672/%2F
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest --cov=sonoraplay --cov-report=term-missing
        env:
          # La prueba de reinicio del broker reinicia el contenedor de servicio del job.
          # El contexto job solo existe dentro de los pasos, no en el env del job.
          RABBITMQ_REINICIO: docker restart ${{ job.services.rabbitmq.id }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive infra/terraform
      # Sin backend ni credenciales: valida la sintaxis y los tipos, no toca AWS.
      - run: |
          for d in infra/terraform infra/terraform/bootstrap; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
      - uses: astral-sh/setup-uv@v6
      # Excepciones justificadas en infra/terraform/.checkov.yaml (EG-26).
      - run: uvx checkov==3.3.29 -d infra/terraform --config-file infra/terraform/.checkov.yaml

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # trae TODO el historial, no solo el último commit
      # gitleaks-action pide licencia en organizaciones; se usa el binario libre.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum -c -
          tar -xzf "${archivo}" gitleaks
      - name: Buscar secretos en todo el historial
        run: ./gitleaks git --redact --verbose --exit-code 1 .