# EG-37/EG-52 · Valores por defecto de los jobs de Spark en Fargate (modo local, un solo contenedor).
# La memoria del driver NO se fija aquí: la define la variable SPARK_DRIVER_MEMORY de la tarea
# (Terraform la calcula como el 75 % de la memoria de la tarea).
spark.sql.session.timeZone            UTC
spark.sql.shuffle.partitions          16
spark.sql.adaptive.enabled            true
spark.ui.enabled                      false
# S3A: credenciales del rol de la tarea (cadena por defecto del SDK v2; incluye el endpoint de metadatos de contenedor de ECS).
spark.hadoop.fs.s3a.aws.credentials.provider  software.amazon.awssdk.auth.credentials.DefaultCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled    true
